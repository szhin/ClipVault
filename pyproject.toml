[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipvault"
version = "0.0.1"
description = "Clipboard manager desktop (Windows, macOS)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",  # AppKit/Foundation cho adapter macOS (Phase 6)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
build = [
    "pyinstaller>=6",  # chỉ để đóng gói (packaging/build.ps1), không phải dependency chạy app
]

[project.scripts]
clipvault = "clipvault.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
